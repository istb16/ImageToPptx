name: .NET

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# リリースのタグを決める処理が同時に走らないよう、main とタグの実行を 1 つずつにする
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  build:

    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    # リリースするタグを決める
    # - タグ（v1.2.3）の push: そのタグ
    # - main への push: そのコミットに付いた v* タグ。なければ最新の v* タグのパッチ番号を 1 つ上げたもの
    # - pull_request: リリースしない
    - name: Determine version
      id: version
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        $tag = ''
        if ($env:REF_TYPE -eq 'tag') {
          $tag = $env:REF_NAME
        } elseif ($env:EVENT_NAME -eq 'push') {
          $semver = '^v\d+\.\d+\.\d+$'
          $existing = @(git tag --points-at HEAD --list 'v*' | Where-Object { $_ -match $semver })
          if ($existing.Count -gt 0) {
            $tag = $existing[0]
          } else {
            $latest = git tag --list 'v*' | Where-Object { $_ -match $semver } |
              Sort-Object { [version]$_.TrimStart('v') } | Select-Object -Last 1
            if ($latest) {
              $v = [version]$latest.TrimStart('v')
              $tag = "v$($v.Major).$($v.Minor).$($v.Build + 1)"
            } else {
              $tag = 'v1.0.0'
            }
          }
        }
        Write-Host "release tag: '$tag'"
        "tag=$tag" >> $env:GITHUB_OUTPUT
    - name: Publish
      env:
        TAG: ${{ steps.version.outputs.tag }}
      # リリースするタグ（v1.2.3）から exe のバージョンを設定する
      run: |
        $versionArgs = @()
        if ($env:TAG) { $versionArgs = @("-p:Version=$($env:TAG.TrimStart('v'))") }
        dotnet publish -p:PublishProfile=FolderProfile @versionArgs
    - name: Create release
      if: steps.version.outputs.tag != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        gh release view $env:TAG *> $null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "release $env:TAG already exists"
          exit 0
        }
        gh release create $env:TAG publish/ImageToPptx.exe --target $env:GITHUB_SHA --title "Release $env:TAG" --generate-notes
