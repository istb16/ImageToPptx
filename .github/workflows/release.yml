name: .NET

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Publish
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      # タグ（v1.2.3）から exe のバージョンを設定する
      run: |
        $versionArgs = @()
        if ($env:REF_TYPE -eq 'tag') { $versionArgs = @("-p:Version=$($env:REF_NAME.TrimStart('v'))") }
        dotnet publish -p:PublishProfile=FolderProfile @versionArgs
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "${{ github.ref_name }}" publish/ImageToPptx.exe --title "Release ${{ github.ref_name }}" --generate-notes
